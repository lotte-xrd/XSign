name: XSign
options:
  bundleIdPrefix: com.xsign
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

targets:
  XSign:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
      - path: DesignSystem
      - path: Core
      - path: Features
      - path: Resources
    dependencies:
      - package: ZIPFoundation
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: XSign
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: StoneBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleLocalizations:
          - en
          - pt-BR
          - es
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App Package
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.apple.itunes.ipa
              - public.zip-archive
          - CFBundleTypeName: Signing Resource
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.data
        CFBundleURLTypes:
          - CFBundleURLName: com.xsign.scheme
            CFBundleURLSchemes:
              - xsign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xsign.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Graphite

# Scheme compartilhado, para `xcodebuild -scheme XSign` funcionar no CI headless.
schemes:
  XSign:
    build:
      targets:
        XSign: all
    run:
      config: Debug
    archive:
      config: Release
