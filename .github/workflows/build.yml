name: Build IPA (unsigned)

# Gera um .ipa NÃO assinado, do jeito que apps de sideload são distribuídos.
# Você assina depois com o seu certificado — pelo próprio XSign ou pelo AltStore/
# SideStore. Não precisa de nenhum segredo/certificado neste workflow.

# Todo push compila o .ipa (artefato). Só a `main` publica o release "latest"
# que a Loja e o auto-update do XSign usam.
on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Baixar ElleKit (Substrate para os tweaks)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/ellekit" Vendor/ElleKit
          if gh release download -R evelyneee/ellekit --pattern '*.deb' -D "$RUNNER_TEMP/ellekit"; then
            ls -la "$RUNNER_TEMP/ellekit"
            DEB=$(ls "$RUNNER_TEMP"/ellekit/*iphoneos-arm64*.deb 2>/dev/null | head -n1 || true)
            if [ -z "$DEB" ]; then DEB=$(ls "$RUNNER_TEMP"/ellekit/*.deb | head -n1); fi
            cp "$DEB" Vendor/ElleKit/ellekit.deb
            echo "ElleKit embutido: $(basename "$DEB")"
          else
            echo "::warning::Não foi possível baixar o ElleKit. Tweaks com Substrate vão pedir o .deb do ElleKit na pasta Tweaks."
          fi

      - name: Gerar o projeto
        run: xcodegen generate

      - name: Compilar (archive não assinado)
        run: |
          set -o pipefail
          xcodebuild \
            -project XSign.xcodeproj \
            -scheme XSign \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/XSign.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: Empacotar o .ipa
        run: |
          APP_DIR="$RUNNER_TEMP/XSign.xcarchive/Products/Applications"
          cd "$APP_DIR"
          mkdir -p Payload
          mv XSign.app Payload/XSign.app
          zip -qry "$RUNNER_TEMP/XSign-unsigned.ipa" Payload
          echo "IPA em $RUNNER_TEMP/XSign-unsigned.ipa"

      - name: Enviar o artefato
        uses: actions/upload-artifact@v4
        with:
          name: XSign-unsigned-ipa
          path: ${{ runner.temp }}/XSign-unsigned.ipa
          if-no-files-found: error

      - name: Publicar Release Latest para a Loja do XSign
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "XSign Latest" --notes "Build oficial do XSign (Exploiting iOS)"
          gh release upload latest "$RUNNER_TEMP/XSign-unsigned.ipa" version.json --clobber
