name: Build IPA (unsigned)

# Gera um .ipa NÃO assinado, do jeito que apps de sideload são distribuídos.
# Você assina depois com o seu certificado — pelo próprio XSign ou pelo AltStore/
# SideStore. Não precisa de nenhum segredo/certificado neste workflow.

# Todo push compila o .ipa (artefato). Só a `main` publica o release "latest"
# que a Loja e o auto-update do XSign usam.
on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Compilar ElleKit (Substrate para os tweaks)
        run: |
          mkdir -p Vendor/ElleKit
          SRC="$RUNNER_TEMP/ellekit-src"
          OUT="$RUNNER_TEMP/ellekit-build/"
          if git clone --depth 1 https://github.com/evelyneee/ellekit "$SRC" && \
             (cd "$SRC" && xcodebuild -project ellekit.xcodeproj -scheme ellekit -configuration Release \
               -destination 'generic/platform=iOS' BUILD_DIR="$OUT" \
               CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet); then
            LIB="$OUT/Release-iphoneos/libellekit.dylib"
            [ -f "$LIB" ] || LIB=$(find "$OUT" -name libellekit.dylib -path '*iphoneos*' -not -path '*.dSYM/*' | head -n1 || true)
            if [ -n "$LIB" ]; then
              cp "$LIB" Vendor/ElleKit/ellekit-substrate.bin
              cp "$SRC/LICENSE" Vendor/ElleKit/ellekit-LICENSE.txt
              echo "ElleKit compilado: $LIB ($(git -C "$SRC" rev-parse --short HEAD))"
            fi
          fi
          if [ ! -f Vendor/ElleKit/ellekit-substrate.bin ]; then
            echo "::warning::O ElleKit não compilou. Tweaks com Substrate vão pedir o .deb do ElleKit na pasta Tweaks."
          fi

      - name: Gerar o projeto
        run: xcodegen generate

      - name: Compilar (archive não assinado)
        run: |
          set -o pipefail
          xcodebuild \
            -project XSign.xcodeproj \
            -scheme XSign \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/XSign.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: Empacotar o .ipa
        run: |
          APP_DIR="$RUNNER_TEMP/XSign.xcarchive/Products/Applications"
          cd "$APP_DIR"
          mkdir -p Payload
          mv XSign.app Payload/XSign.app
          zip -qry "$RUNNER_TEMP/XSign-unsigned.ipa" Payload
          echo "IPA em $RUNNER_TEMP/XSign-unsigned.ipa"

      - name: Conferir o .ipa
        run: |
          unzip -l "$RUNNER_TEMP/XSign-unsigned.ipa" | grep -E "XSign.app/(XSign|ellekit-substrate.bin|ellekit-LICENSE.txt)$" || true
          TMP="$RUNNER_TEMP/ipa-check"; mkdir -p "$TMP"
          unzip -q -o "$RUNNER_TEMP/XSign-unsigned.ipa" "Payload/XSign.app/ellekit-substrate.bin" -d "$TMP" 2>/dev/null || true
          if [ -f "$TMP/Payload/XSign.app/ellekit-substrate.bin" ]; then
            otool -hv "$TMP/Payload/XSign.app/ellekit-substrate.bin" | tail -1
          else
            echo "::warning::O .ipa saiu sem o ElleKit embutido."
          fi

      - name: Enviar o artefato
        uses: actions/upload-artifact@v4
        with:
          name: XSign-unsigned-ipa
          path: ${{ runner.temp }}/XSign-unsigned.ipa
          if-no-files-found: error

      - name: Publicar Release Latest para a Loja do XSign
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "XSign Latest" --notes "Build oficial do XSign (Exploiting iOS)"
          gh release upload latest "$RUNNER_TEMP/XSign-unsigned.ipa" version.json --clobber
